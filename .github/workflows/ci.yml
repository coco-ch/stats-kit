name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Official image rather than the action: the action requires a licence for organisation repositories.
      - name: gitleaks on the whole history
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 detect --source /repo --config /repo/.gitleaks.toml --redact --verbose

  tests:
    name: Tests (server, contract, components) and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: JSON schema up to date
        run: npm run schema:check
      - name: Server and contract (Vitest, coverage)
        run: npm test
      - name: Angular components (coverage)
        run: npm run test:angular
      - name: Build the packages
        run: npm run build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: End to end (Playwright, Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run demo:build
      - run: npx playwright test
        env:
          CI: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  dotnet:
    name: .NET server (unit tests, same answers as the Node server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Node 26: the .NET data and the contract fixtures are generated with its ICU data
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: .NET data and contract fixtures up to date
        run: npm run dotnet:check
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Tests (xUnit)
        working-directory: packages/dotnet
        run: dotnet test --project test/StatsKit.Server.Tests
      - name: Package
        working-directory: packages/dotnet
        run: dotnet pack src/StatsKit.Server -c Release -o artifacts
