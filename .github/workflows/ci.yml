name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Recherche de secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Image officielle plutôt que l'action : celle-ci demande une licence pour les dépôts d'organisation.
      - name: gitleaks sur tout l'historique
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 detect --source /repo --config /repo/.gitleaks.toml --redact --verbose

  tests:
    name: Tests (serveur, contrat, composants) et construction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Schéma JSON à jour
        run: npm run schema:check
      - name: Serveur et contrat (Vitest, couverture)
        run: npm test
      - name: Composants Angular (couverture)
        run: npm run test:angular
      - name: Construction des paquets
        run: npm run build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: couverture
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: Bout en bout (Playwright, Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run demo:build
      - run: npx playwright test
        env:
          CI: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
