name: Fusion automatique Dependabot

# Les mises à jour de dépendances proposées par Dependabot (npm, actions GitHub) sont fusionnées toutes seules (squash) dès que la CI
# est verte, majeures comprises ; une CI rouge laisse la PR ouverte. Rien d'autre n'est fusionné par ce workflow.
# Déclenché à la fin de la CI (workflow_run) : aucune entrée venant de la PR n'est exécutée, seul le nom de la branche est lu.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  fusion:
    name: Fusionner la PR Dependabot
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Fusion
        run: |
          set -euo pipefail
          case "$BRANCH" in dependabot/*) ;; *) echo "Branche inattendue : on ne fait rien."; exit 0 ;; esac
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number,author --jq '[.[] | select(.author.login == "app/dependabot" or .author.login == "dependabot[bot]")][0].number // empty')
          [ -n "$pr" ] || { echo "Aucune PR Dependabot ouverte pour $BRANCH."; exit 0; }
          gh pr merge "$pr" -R "$GITHUB_REPOSITORY" --squash --delete-branch
