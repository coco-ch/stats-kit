# Automatic dependency updates, every Monday at 5 am (Paris time), majors included. The PRs go through CI and are merged
# automatically when it is green (workflow dependabot-merge.yml); a red CI leaves the PR open.
# Angular in its own group, the other npm minors and patches in one group, npm majors one by one, all GitHub Actions in a single PR,
# the test packages of the .NET server in a single PR.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
    groups:
      # Angular: all its packages move together (ng-packagr follows Angular). Declared first: a package goes into the first group that matches it.
      angular:
        patterns: ["@angular/*", "@angular-*", "ng-packagr"]
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The TypeScript major follows the range accepted by Angular (peer of @angular/compiler-cli): it comes with an Angular major.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      # All actions in a single PR, majors included.
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /packages/dotnet
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      nuget:
        patterns: ["*"]
