# Recherche de secrets : règles par défaut de gitleaks. Les faux identifiants de la démo (domaines *.exemple.test, clé RSA
# générée à la volée, jamais écrite) ne déclenchent aucune règle ; rien n'est mis en liste blanche ici.
[extend]
useDefault = true

[allowlist]
description = "Fichiers générés sans secret"
paths = ['''package-lock\.json''', '''packages/serveur/assets/world-110m\.json''']
